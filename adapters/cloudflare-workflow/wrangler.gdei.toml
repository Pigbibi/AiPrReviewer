name = "gdei-pr-reviewer"
main = "worker.mjs"
compatibility_date = "2026-01-01"

[vars]
AI_REVIEW_PROVIDER = "opencode"
AI_REVIEW_MODEL = "gemini-2.5-flash"
AI_REVIEW_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
FALLBACK_WAIT_MINUTES = "12"
REVIEW_MENTION_HANDLE = "@gdei-ai-reviewer review"

[[workflows]]
name = "gdei-pr-review-workflow"
binding = "PR_REVIEW_WORKFLOW"
class_name = "PrReviewWorkflow"
