name = "pigbibi-pr-reviewer"
main = "worker.mjs"
compatibility_date = "2026-01-01"

[vars]
AI_REVIEW_PROVIDER = "deepseek"
AI_REVIEW_PROVIDER_ROLE = "primary"
DEEPSEEK_MODEL = "deepseek-flash"
REVIEWER_LOGIN = "pigbibi-ai-reviewer[bot]"
CODEX_PROBE_MINUTES = "2"
FALLBACK_WAIT_MINUTES = "12"
REVIEW_MENTION_HANDLE = "@pigbibi-ai-reviewer review"
TRUSTED_REVIEWERS_JSON = '{"pigbibi-gemini-reviewer[bot]":["gemini"]}'

[[kv_namespaces]]
binding = "ROUTE_STATE_KV"
id = "ce6ef4bb7e8447d1b6b6f82dae8875a6"

[[workflows]]
name = "pigbibi-pr-review-workflow"
binding = "PR_REVIEW_WORKFLOW"
class_name = "PrReviewWorkflow"

