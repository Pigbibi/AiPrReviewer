name = "pigbibi-gemini-pr-reviewer"
main = "worker.mjs"
compatibility_date = "2026-01-01"

[vars]
AI_REVIEW_PROVIDER = "gemini"
AI_REVIEW_PROVIDER_ROLE = "secondary"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODELS = "gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite"
REVIEWER_LOGIN = "pigbibi-gemini-reviewer[bot]"
TRUSTED_REVIEWERS_JSON = '{"pigbibi-ai-reviewer[bot]":["deepseek"]}'
CODEX_PROBE_MINUTES = "2"
FALLBACK_WAIT_MINUTES = "12"
SECONDARY_GRACE_MINUTES = "3"
REVIEW_MENTION_HANDLE = "@pigbibi-gemini-reviewer review"

[[kv_namespaces]]
binding = "ROUTE_STATE_KV"
id = "ce6ef4bb7e8447d1b6b6f82dae8875a6"

[[workflows]]
name = "pigbibi-gemini-pr-review-workflow"
binding = "PR_REVIEW_WORKFLOW"
class_name = "PrReviewWorkflow"
